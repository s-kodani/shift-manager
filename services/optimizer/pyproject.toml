[project]
name = "shift-planner-optimizer-poc"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = ["ortools==9.15.6755", "protobuf==6.33.6", "jsonschema==4.26.0"]

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.14.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
