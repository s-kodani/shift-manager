name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
      SECURITY_IMAGE: shift-planner-security
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.12.17
          enable-cache: false
      - run: npm run security:install
      - run: uv run --project tools/security --frozen semgrep --test security/rules
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
      - run: docker build -f services/optimizer/Dockerfile -t shift-planner-security .
      - run: npm run security:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: security-reports
          path: artifacts/security/
          retention-days: 7
          if-no-files-found: ignore
# OSS CLI only. No cloud scan upload, paid private code scanning or deployment.
