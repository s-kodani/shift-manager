name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci --legacy-peer-deps
      - name: Check public source boundaries
        run: npm run check:public
      - name: Initialize local test secrets
        run: node scripts/init-local.mjs
      - name: Generate API types
        run: npm run types
      - name: Generate backup types
        run: npm run types:backup
      - name: Generate operator types
        run: npm run types:operator
      - name: Check types, regressions and builds
        run: npm run check
      - name: Build backup Worker without deploying
        run: npm run build:backup
      - name: Test cancellation boundaries with the native checker
        run: npm run test:cancellation-native
      - name: Upload native boundary reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: cancellation-native-boundaries
          path: artifacts/cancellation-native/
          retention-days: 7
          if-no-files-found: ignore
  optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECURITY_IMAGE: shift-manager-optimizer
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.12.17
          enable-cache: false
      - name: Install optimizer dependencies
        run: uv sync --project services/optimizer --frozen --python 3.11
      - name: Check optimizer locks, lint and all regressions
        run: npm run test:optimizer
      - name: Prepare container reports
        run: mkdir -p artifacts/optimizer
      - name: Build optimizer image
        run: docker build --platform linux/amd64 -f services/optimizer/Dockerfile -t "$SECURITY_IMAGE" .
      - name: Probe single-task CLI
        run: docker run --rm --platform linux/amd64 --entrypoint python "$SECURITY_IMAGE" -m optimizer --staff 2 --seconds 5 > artifacts/optimizer/single-task.json
      - name: Probe multi-task CLI with the adopted hint strategy
        run: docker run --rm --platform linux/amd64 --entrypoint python "$SECURITY_IMAGE" -m optimizer --profile multi-task-v1 --staff 2 --seconds 5 --hint-strategy balanced-incumbent-v4 > artifacts/optimizer/multi-task.json
      - name: Verify container runtime and HTTP solve/check
        shell: bash
        run: node scripts/probe-container.mjs 2>&1 | tee artifacts/optimizer/container-probe.log
      - name: Upload optimizer reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: optimizer-docker-probe
          path: artifacts/optimizer/
          retention-days: 7
          if-no-files-found: ignore
# Local regression and build checks; no deployment or performance acceptance.
# Historical CLI/benchmark comparisons run in Optimizer diagnostics on demand.
